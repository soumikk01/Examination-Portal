services:
  # API Service (Express + SQLite)
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: exam-portal-api
    ports:
      - "8787:8787"
    volumes:
      - api-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=8787
    restart: unless-stopped

  # Student Frontend Service (React + Nginx)
  student-web:
    build:
      context: ../apps/student-web
      dockerfile: Dockerfile
    container_name: exam-portal-student-web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  # Redis Service
  redis:
    image: redis:alpine
    container_name: exam-portal-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  api-data:
    driver: local
