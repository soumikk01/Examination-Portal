services:
  # API Service (Express + Prisma → Supabase)
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: exam-portal-api
    ports:
      - "8787:8787"
    env_file:
      - ../backend/.env
    environment:
      - NODE_ENV=production
      - PORT=8787
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  # Student Frontend (React + Nginx)
  student-web:
    build:
      context: ../apps/student-web
      dockerfile: Dockerfile
    container_name: exam-portal-student-web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  # Admin Frontend (React + Nginx)
  admin-web:
    build:
      context: ../apps/admin-web
      dockerfile: Dockerfile
    container_name: exam-portal-admin-web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  # Redis (caching / rate limit)
  redis:
    image: redis:alpine
    container_name: exam-portal-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes: {}
