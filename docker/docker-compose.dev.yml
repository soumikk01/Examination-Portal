# Development configuration with hot reload
# Run from repo root: docker compose -f docker/docker-compose.dev.yml up

services:
  # API (Express + Prisma) - development
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: exam-portal-api-dev
    ports:
      - "8787:8787"
    volumes:
      - ../backend/src:/app/src
    env_file:
      - ../backend/.env
    environment:
      - NODE_ENV=development
      - PORT=8787
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  # Student frontend (Vite dev server)
  student-web:
    build:
      context: ../apps/student-web
      dockerfile: Dockerfile
    container_name: exam-portal-student-web-dev
    ports:
      - "5173:5173"
    volumes:
      - ../apps/student-web/src:/app/src
      - ../apps/student-web/index.html:/app/index.html
    environment:
      - VITE_API_URL=http://localhost:8787/api
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: exam-portal-redis-dev
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes: {}
