# Development configuration with hot reload
# Run from repo root: docker-compose -f docker/docker-compose.dev.yml up

services:
  # API Service (Express + SQLite) - Development Mode
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: exam-portal-api-dev
    ports:
      - "8787:8787"
    volumes:
      - ../backend/src:/app/src
      - api-data:/app/data
    environment:
      - NODE_ENV=development
      - PORT=8787
    restart: unless-stopped

  # Student Frontend Service (React + Vite) - Development Mode
  student-web:
    build:
      context: ../apps/student-web
      dockerfile: Dockerfile
    container_name: exam-portal-student-web-dev
    ports:
      - "5173:5173"
    volumes:
      - ../apps/student-web/src:/app/src
      - ../apps/student-web/index.html:/app/index.html
    environment:
      - VITE_API_URL=http://localhost:8787/api
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:
    driver: local
