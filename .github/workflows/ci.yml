name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Lint and Test Student Web
  student-web:
    name: Student Web CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Run ESLint
        run: npm run lint -w apps/student-web --if-present

      - name: Run Tests
        run: npm run test -w apps/student-web --if-present

      - name: Build
        run: npm run build -w apps/student-web

  # Lint Backend
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Run ESLint
        run: npm run lint -w backend --if-present

  # Lint and Build Admin Web
  admin-web:
    name: Admin Web CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Run ESLint
        run: npm run lint -w apps/admin-web --if-present

      - name: Build
        run: npm run build -w apps/admin-web

  # Build Docker Images
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [student-web, admin-web, backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose -f docker/docker-compose.yml build

